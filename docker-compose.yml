services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tatamap
      POSTGRES_PASSWORD: tatamap
      POSTGRES_DB: tatamap
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - tatamap-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tatamap -d tatamap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tatamap-pgdata:
