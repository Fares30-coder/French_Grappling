name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tatamap
          POSTGRES_PASSWORD: tatamap
          POSTGRES_DB: tatamap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tatamap"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tatamap:tatamap@localhost:5432/tatamap
      # CI has a single throwaway database: the tests use the same one.
      TEST_DATABASE_URL: postgresql://tatamap:tatamap@localhost:5432/tatamap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 - reads "packageManager" from package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @tatamap/api exec prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm test
      - run: pnpm build
