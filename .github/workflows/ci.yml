name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # Rollback (ADR 0005 D4): redeploys the images already built for a previous commit.
  workflow_dispatch:
    inputs:
      sha:
        description: Full SHA of a commit of main whose images already exist
        required: true

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run that may be deploying.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tatamap
          POSTGRES_PASSWORD: tatamap
          POSTGRES_DB: tatamap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tatamap"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tatamap:tatamap@localhost:5432/tatamap
      # CI has a single throwaway database: the tests use the same one.
      TEST_DATABASE_URL: postgresql://tatamap:tatamap@localhost:5432/tatamap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 - reads "packageManager" from package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @tatamap/api exec prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm test
      - run: pnpm build

  # The images must never contain private content (content/ is another repo, ADR 0005 D2): a decoy
  # file is planted where content/ would be, and must be absent from every image.
  docker:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Plant a decoy in content/
        run: |
          mkdir -p content/techniques
          echo '{}' > content/techniques/TATAMAP-CONTENT-DECOY.json
          echo '{}' > content/positions.json
      - name: Build the three images and look for the decoy
        run: |
          for target in web api tools; do
            docker buildx build --target "$target" --load -t "check-$target" .
            if docker run --rm --entrypoint sh "check-$target" -c \
              'find / -xdev 2>/dev/null \( -name TATAMAP-CONTENT-DECOY.json -o -path "*/content/positions.json" \) | grep .'; then
              echo "::error::content/ leaked into the $target image"; exit 1
            fi
          done

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image owner in lower case
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          push: true
          tags: ghcr.io/${{ env.OWNER }}/tatamap-web:${{ github.sha }}
          # Public build variables (Actions variables, not secrets); empty = no ads / legal fields to fill.
          build-args: |
            VITE_ADSENSE_CLIENT=${{ vars.VITE_ADSENSE_CLIENT }}
            VITE_ADSENSE_SLOT_RAIL=${{ vars.VITE_ADSENSE_SLOT_RAIL }}
            VITE_LEGAL_NAME=${{ vars.VITE_LEGAL_NAME }}
            VITE_LEGAL_STATUS=${{ vars.VITE_LEGAL_STATUS }}
            VITE_LEGAL_SIRET=${{ vars.VITE_LEGAL_SIRET }}
            VITE_LEGAL_ADDRESS=${{ vars.VITE_LEGAL_ADDRESS }}
            VITE_LEGAL_EMAIL=${{ vars.VITE_LEGAL_EMAIL }}
            VITE_LEGAL_DIRECTOR=${{ vars.VITE_LEGAL_DIRECTOR }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          push: true
          tags: ghcr.io/${{ env.OWNER }}/tatamap-api:${{ github.sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: tools
          push: true
          tags: ghcr.io/${{ env.OWNER }}/tatamap-tools:${{ github.sha }}

  # Only job with secrets: the SSH key is tied to a forced command on the VPS that accepts a SHA
  # and nothing else. No application secret lives in GitHub.
  deploy:
    if: ${{ !cancelled() && (needs.images.result == 'success' || github.event_name == 'workflow_dispatch') }}
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Pick the SHA
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha="${INPUT_SHA:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a full SHA"; exit 1; }
          echo "SHA=$sha" >> "$GITHUB_ENV"
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "deploy@$DEPLOY_HOST" "$SHA"
