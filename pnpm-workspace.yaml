packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@types/node": ^24.19.2
  react: ~19.3.1
  react-dom: ~19.3.1
  typescript: ~6.0.3
  vitest: ~5.0.5
  zod: ~4.6.7

allowBuilds:
  esbuild: true
  prisma: true
  "@prisma/engines": true
  workerd: true

overrides:
  effect: "^3.22.1"

minimumReleaseAgeExclude:
  - react-router@8.5.1
  - "@cloudflare/workers-utils@0.57.0"
  - miniflare@5.20261123.1-beta
  - wrangler@4.168.0
