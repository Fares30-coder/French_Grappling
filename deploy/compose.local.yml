# Local trial of the production stack: builds the images instead of pulling them.
#   docker compose --env-file local.env -f compose.prod.yml -f compose.local.yml up -d --build
# with GHCR_OWNER=local, SITE_DOMAIN=localhost and the other variables of .env.example.
# CSP checks: build with VITE_ADSENSE_CLIENT=ca-pub-0000000000000000 (any fake) for the adsense profile.
services:
  caddy:
    image: tatamap-local/web
    build:
      context: ..
      target: web
      args:
        VITE_ADSENSE_CLIENT: ${VITE_ADSENSE_CLIENT:-}
        VITE_ADSENSE_SLOT_RAIL: ${VITE_ADSENSE_SLOT_RAIL:-}
  api:
    image: tatamap-local/api
    build: { context: .., target: api }
  tools:
    image: tatamap-local/tools
    build: { context: .., target: tools }
