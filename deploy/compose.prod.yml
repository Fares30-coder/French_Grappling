# Production stack (ADR 0005 D1). Only caddy publishes ports: Docker bypasses the host firewall for
# published ports, so api and db never get a `ports:` entry. Read the variables from ../.env.
name: tatamap

services:
  caddy:
    image: ghcr.io/${GHCR_OWNER:?}/tatamap-web:${TAG:?}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
      CSP_PROFILE: ${CSP_PROFILE:-adsense}
      CSP_HEADER: ${CSP_HEADER:-Content-Security-Policy}
      PRELAUNCH: ${PRELAUNCH:-on}
      PRELAUNCH_USER: ${PRELAUNCH_USER:-}
      PRELAUNCH_HASH: ${PRELAUNCH_HASH:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [front]
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  api:
    image: ghcr.io/${GHCR_OWNER:?}/tatamap-api:${TAG:?}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://tatamap:${POSTGRES_PASSWORD:?}@db:5432/tatamap
      JWT_SECRET: ${JWT_SECRET:?}
      WEB_ORIGINS: ${WEB_ORIGINS:?}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    networks: [front, back]
    logging: *logging

  db:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tatamap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: tatamap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tatamap -d tatamap"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [back]
    logging: *logging

  # On demand only: docker compose run --rm tools pnpm --filter @tatamap/api exec prisma migrate deploy
  tools:
    image: ghcr.io/${GHCR_OWNER:?}/tatamap-tools:${TAG:?}
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql://tatamap:${POSTGRES_PASSWORD:?}@db:5432/tatamap
      CONTENT_DIR: ${CONTENT_DIR:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [back]

networks:
  front: {}
  # No route to the outside: the database cannot be reached from, or reach, the internet.
  back:
    internal: true

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
